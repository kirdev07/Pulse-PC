name: Pulse PC 1.0 source release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run API security regression tests
        run: python -m unittest discover -s tests -p test_local_api_security.py -v
      - name: Build source-only ZIP
        run: python build_release.py
      - name: Publish release v1.0.0 if not already published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v1.0.0 already exists; not overwriting published release."
            exit 0
          }
          gh release create v1.0.0 "Pulse-PC-1.0.0-Windows-Python.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Pulse-PC 1.0.0 — Windows / Python" --notes "Pulse-PC 1.0.0: Python + PySide6 desktop app for Windows, Telegram bot and LAN phone API. Download the ZIP, extract it, and run install.bat. Python 3.10+ (64-bit) is required. No EXE is included. Pair phones only on a trusted LAN; the LAN HTTP API is not encrypted. See README.md, PRIVACY_POLICY.md and LICENSE."
