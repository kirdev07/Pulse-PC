name: Pulse PC security tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run LAN API security tests
        run: python -m unittest discover -s tests -p test_local_api_security.py -v
